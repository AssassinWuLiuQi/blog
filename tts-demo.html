<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Audio Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        danger: '#EF4444',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .btn-animation {
                @apply transition-all duration-300 ease-in-out transform hover:scale-105 active:scale-95;
            }
            .card-shadow {
                @apply shadow-lg hover:shadow-xl transition-shadow duration-300;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl p-8 max-w-md w-full card-shadow">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-8">WebSocket Audio Player</h1>
        
        <div class="flex justify-center">
            <button id="toggleButton" class="btn-animation bg-primary hover:bg-primary/90 text-white font-bold py-4 px-8 rounded-full flex items-center justify-center gap-2">
                <i class="fa fa-play text-xl"></i>
                <span>Start Listening</span>
            </button>
        </div>
        
        <div id="status" class="mt-6 text-center text-gray-600 hidden">
            <i class="fa fa-circle-o-notch fa-spin mr-2"></i>
            <span>Connecting...</span>
        </div>
    </div>

    <script>
        class AudioPlayer {
            constructor() {
                this.isPlaying = false;
                this.socket = null;
                this.audioContext = null;
                this.audioSource = null;
                this.queue = [];
                this.scriptProcessor = null;
                
                // 新增：用于累积音频数据的临时缓冲区
                this.tempBuffer = new Float32Array();
                this.targetBufferSize = 8192; // 目标缓冲区大小
                
                // DOM元素
                this.toggleButton = document.getElementById('toggleButton');
                this.statusElement = document.getElementById('status');
                
                // 绑定事件
                this.toggleButton.addEventListener('click', () => this.togglePlayback());
            }
            
            // 处理WebSocket消息
            handleWebSocketMessage(event) {
                if (!this.isPlaying || !this.audioContext) return;
                
                try {
                    const repData = JSON.parse(event.data);
                    // 解码base64音频数据
                    const audioData = atob(repData.result.data);
                    
                    // 将原始音频数据转换为Float32Array
                    const float32Array = this.convertToFloat32(audioData);
                    console.log('原始数据长度:', float32Array.length);
                    
                    // 合并到临时缓冲区
                    this.mergeToTempBuffer(float32Array);
                    
                    // 处理临时缓冲区，提取8192长度的数据块
                    this.processTempBuffer();
                } catch (e) {
                    console.error('Error processing WebSocket message:', e);
                }
            }
            
            // 合并新数据到临时缓冲区
            mergeToTempBuffer(newData) {
                const combinedLength = this.tempBuffer.length + newData.length;
                const combinedData = new Float32Array(combinedLength);
                
                // 复制现有临时缓冲区数据
                if (this.tempBuffer.length > 0) {
                    combinedData.set(this.tempBuffer);
                }
                
                // 添加新数据
                combinedData.set(newData, this.tempBuffer.length);
                
                this.tempBuffer = combinedData;
            }
            
            // 处理临时缓冲区，提取固定长度的数据块
            processTempBuffer() {
                // 当临时缓冲区数据长度大于等于目标大小时，提取数据块
                while (this.tempBuffer.length >= this.targetBufferSize) {
                    // 提取目标大小的数据块
                    const chunk = this.tempBuffer.subarray(0, this.targetBufferSize);
                    
                    // 将提取后的数据放入队列
                    this.queue.push(chunk);
                    console.log('放入队列的数据块长度:', chunk.length);
                    
                    // 更新临时缓冲区，保留剩余数据
                    if (this.tempBuffer.length > this.targetBufferSize) {
                        this.tempBuffer = this.tempBuffer.subarray(this.targetBufferSize);
                    } else {
                        this.tempBuffer = new Float32Array(); // 清空缓冲区
                    }
                }
            }
            
            // 停止播放
            stop() {
                this.isPlaying = false;
                this.updateUI();
                
                if (this.socket) {
                    this.socket.close();
                    this.socket = null;
                }
                
                if (this.audioContext) {
                    this.audioContext.close();
                    this.audioContext = null;
                }
                
                this.queue = [];
                this.tempBuffer = new Float32Array(); // 清空临时缓冲区
            }
            
            // 切换播放状态
            togglePlayback() {
                if (this.isPlaying) {
                    this.stop();
                } else {
                    this.start();
                }
            }
            
            // 开始播放
            start() {
                this.isPlaying = true;
                this.updateUI();
                this.initAudioContext();
                this.connectWebSocket();
            }
            
            // 停止播放
            stop() {
                this.isPlaying = false;
                this.updateUI();
                
                if (this.socket) {
                    this.socket.close();
                    this.socket = null;
                }
                
                if (this.audioContext) {
                    this.audioContext.close();
                    this.audioContext = null;
                }
                
                this.queue = [];
            }
            
            // 初始化音频上下文
            initAudioContext() {
                try {
                    window.AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.audioContext = new AudioContext({sampleRate: 24000});
                    
                    // 创建脚本处理器节点来处理音频数据
                    // 对于16000Hz采样率，缓冲区大小选择512或1024比较合适
                    this.scriptProcessor = this.audioContext.createScriptProcessor(8192, 1, 1);
                    this.scriptProcessor.onaudioprocess = (e) => this.processAudio(e);
                    this.scriptProcessor.connect(this.audioContext.destination);
                } catch (e) {
                    console.error('Web Audio API is not supported in this browser', e);
                    alert('Web Audio API is not supported in this browser');
                }
            }
            
            // 连接WebSocket
            connectWebSocket() {
                // 这里替换为您的WebSocket服务器地址
                const wsUrl = 'ws://10.105.151.103:10011/createRec';
                
                try {
                    this.socket = new WebSocket(wsUrl);
                    
                    this.socket.onopen = () => {
                        console.log('WebSocket connection established');
                        this.updateStatus('Connected - Receiving audio...');
                        this.socket.send(
                            JSON.stringify({
                                "sessionParam": {
                                    "sid": "1231231",
                                    "speed": "-100",
                                    "frame_size": "640",
                                    "native_voice_name": "lingfeibo_profnews"
                                },
                                "text": "中华人民共和国中华人民共和国中华人民共和国中华人民共和国",
                            })
                        )
                    };
                    
                    this.socket.onmessage = (event) => this.handleWebSocketMessage(event);
                    
                    this.socket.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        this.updateStatus('Connection error', true);
                    };
                    
                    this.socket.onclose = () => {
                        console.log('WebSocket connection closed');
                        if (this.isPlaying) {
                            this.updateStatus('Connection closed - Reconnecting...');
                            // 自动重连
                            setTimeout(() => this.connectWebSocket(), 3000);
                        } else {
                            this.updateStatus('');
                        }
                    };
                } catch (e) {
                    console.error('Failed to connect WebSocket:', e);
                    this.updateStatus('Connection failed', true);
                }
            }
            
            // 将原始音频数据转换为Float32Array
            convertToFloat32(rawData) {
                const buffer = new ArrayBuffer(rawData.length);
                const view = new Uint8Array(buffer);
                
                // 填充缓冲区
                for (let i = 0; i < rawData.length; i++) {
                    view[i] = rawData.charCodeAt(i);
                }
                
                // 转换为16位整数
                const int16Array = new Int16Array(buffer);
                
                // 转换为32位浮点数 (-1.0 到 1.0)
                const float32Array = new Float32Array(int16Array.length);
                for (let i = 0; i < int16Array.length; i++) {
                    float32Array[i] = int16Array[i] / 32768; // 16位整数的范围是-32768到32767
                }
                
                return float32Array;
            }
            
            // 处理音频播放
            processAudio(event) {
                const outputBuffer = event.outputBuffer.getChannelData(0);
                
                // 如果队列中有数据，就取出播放
                if (this.queue.length > 0) {
                    const audioData = this.queue.shift();
                    for (let i = 0; i < outputBuffer.length; i++) {
                        outputBuffer[i] = i < audioData.length ? audioData[i] : 0;
                    }
                } else {
                    // 如果队列中没有数据，输出静音
                    for (let i = 0; i < outputBuffer.length; i++) {
                        outputBuffer[i] = 0;
                    }
                }
            }
            
            // 更新UI状态
            updateUI() {
                if (this.isPlaying) {
                    this.toggleButton.innerHTML = '<i class="fa fa-stop text-xl"></i><span>Stop Listening</span>';
                    this.toggleButton.classList.remove('bg-primary', 'hover:bg-primary/90');
                    this.toggleButton.classList.add('bg-danger', 'hover:bg-danger/90');
                    this.statusElement.classList.remove('hidden');
                    this.updateStatus('Connecting...');
                } else {
                    this.toggleButton.innerHTML = '<i class="fa fa-play text-xl"></i><span>Start Listening</span>';
                    this.toggleButton.classList.remove('bg-danger', 'hover:bg-danger/90');
                    this.toggleButton.classList.add('bg-primary', 'hover:bg-primary/90');
                    this.updateStatus('');
                }
            }
            
            // 更新状态文本
            updateStatus(text, isError = false) {
                if (!text) {
                    this.statusElement.classList.add('hidden');
                    return;
                }
                
                this.statusElement.classList.remove('hidden');
                this.statusElement.innerHTML = `<i class="fa fa-circle-o-notch fa-spin mr-2"></i><span>${text}</span>`;
                
                if (isError) {
                    this.statusElement.classList.add('text-danger');
                } else {
                    this.statusElement.classList.remove('text-danger');
                }
            }
        }
        
        // 页面加载完成后初始化播放器
        document.addEventListener('DOMContentLoaded', () => {
            const player = new AudioPlayer();
        });
    </script>
</body>
</html>
