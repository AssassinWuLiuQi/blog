<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS流式播放器</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        accent: '#06b6d4',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .glass-effect {
                @apply bg-white bg-opacity-20 backdrop-blur-lg;
            }
            .slider-thumb {
                @apply appearance-none w-4 h-4 rounded-full bg-primary cursor-pointer;
            }
            .slider-track {
                @apply appearance-none h-2 rounded-lg bg-gray-200;
            }
            .btn-primary {
                @apply bg-primary hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50;
            }
            .btn-secondary {
                @apply bg-secondary hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50;
            }
            .btn-danger {
                @apply bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-50;
            }
            .card {
                @apply bg-white rounded-xl shadow-lg p-6 transition-all duration-300 hover:shadow-xl;
            }
            .input-field {
                @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent;
            }
            .select-field {
                @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white;
            }
            .tooltip {
                @apply invisible absolute bg-dark text-white text-xs rounded py-1 px-2 -mt-8 opacity-0 transition-opacity duration-300;
            }
            .has-tooltip:hover .tooltip {
                @apply visible opacity-100 z-50;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4 md:p-8">
    <div class="container mx-auto max-w-6xl">
        <!-- 页面标题 -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-dark mb-2">TTS流式播放器</h1>
            <p class="text-secondary">实时文本转语音，边合成边播放</p>
        </header>

        <!-- 主要内容区域 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧控制面板 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 文本输入卡片 -->
                <div class="card">
                    <h2 class="text-xl font-semibold text-dark mb-4 flex items-center">
                        <i class="fa fa-file-text-o mr-2 text-primary"></i>文本输入
                    </h2>
                    <div class="mb-4">
                        <label for="text-input" class="block text-sm font-medium text-gray-700 mb-1">输入要转换的文本</label>
                        <textarea id="text-input" rows="6" class="input-field" placeholder="请输入要转换为语音的文本...">今天是不是很开心呀(laughs)，当然了！这是一个TTS流式播放器示例，您可以实时听到语音合成的效果。</textarea>
                        <div class="flex justify-between text-xs text-gray-500 mt-1">
                            <span id="char-count">0/10000</span>
                            <button id="clear-text" class="text-primary hover:text-blue-700">清空</button>
                        </div>
                    </div>
                    
                    <!-- 语音参数设置 -->
                    <h3 class="text-lg font-medium text-dark mb-3">语音参数设置</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- 模型选择 -->
                        <div>
                            <label for="model-select" class="block text-sm font-medium text-gray-700 mb-1">语音模型</label>
                            <select id="model-select" class="select-field">
                                <option value="speech-2.8-hd">speech-2.8-hd (高清)</option>
                                <option value="speech-2.8-turbo">speech-2.8-turbo (快速)</option>
                                <option value="speech-2.6-hd">speech-2.6-hd (高清)</option>
                                <option value="speech-2.6-turbo">speech-2.6-turbo (快速)</option>
                                <option value="speech-02-hd">speech-02-hd (高清)</option>
                                <option value="speech-02-turbo">speech-02-turbo (快速)</option>
                            </select>
                        </div>
                        
                        <!-- 音色选择 -->
                        <div>
                            <label for="voice-select" class="block text-sm font-medium text-gray-700 mb-1">音色选择</label>
                            <select id="voice-select" class="select-field">
                                <option value="male-qn-qingse">男声 - 青瑟</option>
                                <option value="female-chengshu">女声 - 成熟</option>
                                <option value="female-tianmei">女声 - 甜美</option>
                                <option value="male-youth">男声 - 青年</option>
                                <option value="male-deep">男声 - 深沉</option>
                                <option value="female-qingchun">女声 - 青春</option>
                            </select>
                        </div>
                        
                        <!-- 语速设置 -->
                        <div>
                            <label for="speed-slider" class="block text-sm font-medium text-gray-700 mb-1">
                                语速 <span id="speed-value">1.0</span>
                            </label>
                            <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1.0" 
                                class="slider-track w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        
                        <!-- 音量设置 -->
                        <div>
                            <label for="volume-slider" class="block text-sm font-medium text-gray-700 mb-1">
                                音量 <span id="volume-value">1.0</span>
                            </label>
                            <input type="range" id="volume-slider" min="0.1" max="10" step="0.1" value="1.0" 
                                class="slider-track w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        
                        <!-- 语调设置 -->
                        <div>
                            <label for="pitch-slider" class="block text-sm font-medium text-gray-700 mb-1">
                                语调 <span id="pitch-value">0</span>
                            </label>
                            <input type="range" id="pitch-slider" min="-12" max="12" step="1" value="0" 
                                class="slider-track w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        
                        <!-- 情绪设置 -->
                        <div>
                            <label for="emotion-select" class="block text-sm font-medium text-gray-700 mb-1">情绪</label>
                            <select id="emotion-select" class="select-field">
                                <option value="calm">中性</option>
                                <option value="happy">高兴</option>
                                <option value="sad">悲伤</option>
                                <option value="angry">愤怒</option>
                                <option value="fearful">害怕</option>
                                <option value="disgusted">厌恶</option>
                                <option value="surprised">惊讶</option>
                                <option value="fluent">生动</option>
                                <option value="whisper">低语</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- API设置卡片 -->
                <div class="card">
                    <h2 class="text-xl font-semibold text-dark mb-4 flex items-center">
                        <i class="fa fa-cog mr-2 text-primary"></i>API设置
                    </h2>
                    <div class="mb-4">
                        <label for="api-key" class="block text-sm font-medium text-gray-700 mb-1">API Key</label>
                        <input type="password" id="api-key" class="input-field" placeholder="请输入您的API Key">
                        <p class="text-xs text-gray-500 mt-1">您可以在<a href="https://platform.minimaxi.com/user-center/basic-information/interface-key" target="_blank" class="text-primary hover:underline">账户管理&gt;接口密钥</a>中获取API Key</p>
                    </div>
                    <div>
                        <label for="api-endpoint" class="block text-sm font-medium text-gray-700 mb-1">API 端点</label>
                        <input type="text" id="api-endpoint" class="input-field" value="https://api-bj.minimaxi.com/v1/t2a_v2" placeholder="API端点URL">
                    </div>
                </div>
            </div>
            
            <!-- 右侧播放控制和可视化区域 -->
            <div class="space-y-6">
                <!-- 播放控制卡片 -->
                <div class="card">
                    <h2 class="text-xl font-semibold text-dark mb-4 flex items-center">
                        <i class="fa fa-play-circle mr-2 text-primary"></i>播放控制
                    </h2>
                    
                    <!-- 播放按钮组 -->
                    <div class="flex justify-center space-x-4 mb-6">
                        <button id="start-btn" class="btn-primary flex items-center justify-center w-16 h-16 rounded-full">
                            <i class="fa fa-play text-xl"></i>
                        </button>
                        <button id="pause-btn" class="btn-secondary flex items-center justify-center w-16 h-16 rounded-full" disabled>
                            <i class="fa fa-pause text-xl"></i>
                        </button>
                        <button id="stop-btn" class="btn-danger flex items-center justify-center w-16 h-16 rounded-full" disabled>
                            <i class="fa fa-stop text-xl"></i>
                        </button>
                    </div>
                    
                    <!-- 播放进度条 -->
                    <div class="mb-4">
                        <div class="flex justify-between text-sm text-gray-600 mb-1">
                            <span id="current-time">00:00</span>
                            <span id="total-time">00:00</span>
                        </div>
                        <div class="relative">
                            <div id="progress-bar" class="h-2 bg-gray-200 rounded-full overflow-hidden">
                                <div id="progress-fill" class="h-full bg-primary rounded-full" style="width: 0%"></div>
                            </div>
                            <div id="progress-handle" class="absolute w-4 h-4 bg-white border-2 border-primary rounded-full -mt-1 cursor-pointer" style="left: 0%"></div>
                        </div>
                    </div>
                    
                    <!-- 下载按钮 -->
                    <div class="text-center">
                        <button id="download-btn" class="btn-secondary flex items-center justify-center mx-auto" disabled>
                            <i class="fa fa-download mr-2"></i>下载音频
                        </button>
                    </div>
                </div>
                
                <!-- 音频可视化卡片 -->
                <div class="card">
                    <h2 class="text-xl font-semibold text-dark mb-4 flex items-center">
                        <i class="fa fa-area-chart mr-2 text-primary"></i>音频可视化
                    </h2>
                    <div class="h-48 relative">
                        <canvas id="waveform-chart"></canvas>
                        <div id="visualization-placeholder" class="absolute inset-0 flex items-center justify-center text-gray-400">
                            <div class="text-center">
                                <i class="fa fa-volume-up text-4xl mb-2"></i>
                                <p>点击播放按钮开始可视化</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 状态信息卡片 -->
                <div class="card">
                    <h2 class="text-xl font-semibold text-dark mb-4 flex items-center">
                        <i class="fa fa-info-circle mr-2 text-primary"></i>状态信息
                    </h2>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-600">状态:</span>
                            <span id="status-text" class="font-medium">就绪</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">音频长度:</span>
                            <span id="audio-length">0 秒</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">处理进度:</span>
                            <span id="processing-progress">0%</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">API 响应:</span>
                            <span id="api-status" class="font-medium text-green-600">未请求</span>
                        </div>
                    </div>
                    <div class="mt-4">
                        <div class="text-xs text-gray-500 mb-1">API 响应详情:</div>
                        <div id="api-response" class="text-xs bg-gray-50 p-2 rounded max-h-24 overflow-y-auto font-mono">
                            暂无响应数据
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 页脚 -->
        <footer class="mt-12 text-center text-sm text-gray-500">
            <p>© 2025 TTS流式播放器 | 使用 MiniMax TTS API</p>
        </footer>
    </div>

    <!-- 应用脚本 -->
    <script>
        // DOM 元素引用
        const textInput = document.getElementById('text-input');
        const charCount = document.getElementById('char-count');
        const clearTextBtn = document.getElementById('clear-text');
        const modelSelect = document.getElementById('model-select');
        const voiceSelect = document.getElementById('voice-select');
        const speedSlider = document.getElementById('speed-slider');
        const speedValue = document.getElementById('speed-value');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeValue = document.getElementById('volume-value');
        const pitchSlider = document.getElementById('pitch-slider');
        const pitchValue = document.getElementById('pitch-value');
        const emotionSelect = document.getElementById('emotion-select');
        const apiKeyInput = document.getElementById('api-key');
        const apiEndpointInput = document.getElementById('api-endpoint');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const stopBtn = document.getElementById('stop-btn');
        const downloadBtn = document.getElementById('download-btn');
        const currentTimeDisplay = document.getElementById('current-time');
        const totalTimeDisplay = document.getElementById('total-time');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const progressHandle = document.getElementById('progress-handle');
        const statusText = document.getElementById('status-text');
        const audioLengthDisplay = document.getElementById('audio-length');
        const processingProgressDisplay = document.getElementById('processing-progress');
        const apiStatusDisplay = document.getElementById('api-status');
        const apiResponseDisplay = document.getElementById('api-response');
        const waveformChart = document.getElementById('waveform-chart');
        const visualizationPlaceholder = document.getElementById('visualization-placeholder');
        
        // 应用状态
        let audioContext;
        let audioBufferSource;
        let gainNode;
        let audioBufferQueue = [];
        let isPlaying = false;
        let isPaused = false;
        let currentTime = 0;
        let totalDuration = 0;
        let startTime = 0;
        let lastUpdateTime = 0;
        let streamResponse = null;
        let audioBlob = new Blob([], { type: 'audio/mp3' });
        let isProcessing = false;
        let processedChunks = 0;
        let totalChunks = 0;
        let chart;
        let audioDataArray = [];
        let animationFrameId;
        
        // 初始化字符计数
        updateCharCount();
        
        // 初始化图表
        initChart();
        
        // 事件监听器
        textInput.addEventListener('input', updateCharCount);
        clearTextBtn.addEventListener('click', clearText);
        speedSlider.addEventListener('input', updateSpeedValue);
        volumeSlider.addEventListener('input', updateVolumeValue);
        pitchSlider.addEventListener('input', updatePitchValue);
        startBtn.addEventListener('click', startStreaming);
        pauseBtn.addEventListener('click', pausePlayback);
        stopBtn.addEventListener('click', stopPlayback);
        downloadBtn.addEventListener('click', downloadAudio);
        progressBar.addEventListener('click', seekAudio);
        progressHandle.addEventListener('mousedown', startSeek);
        
        // 更新字符计数
        function updateCharCount() {
            const count = textInput.value.length;
            charCount.textContent = `${count}/10000`;
            
            // 超出字符限制时显示警告
            if (count > 10000) {
                charCount.classList.add('text-red-500');
                textInput.classList.add('border-red-500');
            } else {
                charCount.classList.remove('text-red-500');
                textInput.classList.remove('border-red-500');
            }
        }
        
        // 清空文本
        function clearText() {
            textInput.value = '';
            updateCharCount();
        }
        
        // 更新语速显示
        function updateSpeedValue() {
            speedValue.textContent = speedSlider.value;
        }
        
        // 更新音量显示
        function updateVolumeValue() {
            volumeValue.textContent = volumeSlider.value;
            if (gainNode) {
                gainNode.gain.value = parseFloat(volumeSlider.value);
            }
        }
        
        // 更新语调显示
        function updatePitchValue() {
            pitchValue.textContent = pitchSlider.value;
        }
        
        // 初始化图表
        function initChart() {
            const ctx = waveformChart.getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '音频波形',
                        data: [],
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            display: false
                        },
                        y: {
                            display: false,
                            min: -1,
                            max: 1
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            enabled: false
                        }
                    },
                    animation: {
                        duration: 0
                    }
                }
            });
        }
        
        // 更新波形图
        function updateWaveform(audioData) {
            // 将新的音频数据添加到数组
            audioDataArray = audioDataArray.concat(Array.from(audioData));
            
            // 限制数组长度，防止性能问题
            const maxDataPoints = 500;
            if (audioDataArray.length > maxDataPoints) {
                audioDataArray = audioDataArray.slice(-maxDataPoints);
            }
            
            // 更新图表数据
            chart.data.labels = Array(audioDataArray.length).fill('');
            chart.data.datasets[0].data = audioDataArray;
            chart.update();
        }
        
        // 开始流式TTS
        async function startStreaming() {
            // 验证输入
            const text = textInput.value.trim();
            if (!text) {
                alert('请输入要转换的文本');
                return;
            }
            
            if (text.length > 10000) {
                alert('文本长度不能超过10000字符');
                return;
            }
            
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert('请输入API Key');
                return;
            }
            
            // 重置状态
            resetAudioState();
            
            // 更新UI状态
            setPlayingState(true);
            statusText.textContent = '正在连接API...';
            statusText.className = 'font-medium text-blue-600';
            apiStatusDisplay.textContent = '请求中';
            apiStatusDisplay.className = 'font-medium text-blue-600';
            visualizationPlaceholder.style.display = 'none';
            
            try {
                // 准备请求参数
                const requestData = {
                    model: modelSelect.value,
                    text: text,
                    stream: true,
                    voice_setting: {
                        voice_id: voiceSelect.value,
                        speed: parseFloat(speedSlider.value),
                        vol: parseFloat(volumeSlider.value),
                        pitch: parseInt(pitchSlider.value),
                        emotion: emotionSelect.value
                    },
                    audio_setting: {
                        sample_rate: 32000,
                        bitrate: 128000,
                        format: 'mp3',
                        channel: 1
                    },
                    subtitle_enable: false
                };
                
                // 记录API请求开始时间
                const requestStartTime = Date.now();
                
                // 发送API请求
                const response = await fetch(apiEndpointInput.value, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(requestData)
                });
                
                // 检查响应状态
                if (!response.ok) {
                    throw new Error(`API请求失败: ${response.status} ${response.statusText}`);
                }
                
                // 记录API响应时间
                const responseTime = Date.now() - requestStartTime;
                apiStatusDisplay.textContent = `响应时间: ${responseTime}ms`;
                apiStatusDisplay.className = 'font-medium text-green-600';
                
                // 获取响应体的读取器
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let done = false;
                let partialChunk = '';
                
                // 处理流式响应
                while (!done) {
                    const { value, done: readerDone } = await reader.read();
                    done = readerDone;
                    
                    if (value) {
                        // 解码响应数据
                        const chunk = decoder.decode(value, { stream: true });
                        const data = partialChunk + chunk;
                        
                        // 分割SSE事件
                        const events = data.split('\n\n');
                        partialChunk = events.pop() || '';
                        
                        // 处理每个事件
                        for (const event of events) {
                            if (!event.trim()) continue;
                            
                            try {
                                // 解析JSON数据
                                const eventData = event.replace(/^data:/, '').trim();
                                const jsonData = JSON.parse(eventData);
                                
                                // 更新API响应显示
                                updateApiResponse(jsonData);
                                
                                // 处理音频数据
                                if (jsonData.data && jsonData.data.audio) {
                                    // 将hex转换为ArrayBuffer
                                    const audioHex = jsonData.data.audio;
                                    const audioBytes = new Uint8Array(audioHex.length / 2);
                                    
                                    for (let i = 0; i < audioHex.length; i += 2) {
                                        audioBytes[i / 2] = parseInt(audioHex.substr(i, 2), 16);
                                    }
                                    
                                    // 添加到音频Blob
                                    audioBlob = new Blob([audioBlob, audioBytes], { type: 'audio/mp3' });
                                    
                                    // 解码音频数据并播放
                                    if (isPlaying && !isPaused) {
                                        await decodeAndPlayAudio(audioBytes.buffer);
                                    } else {
                                        // 如果暂停或停止，将音频数据加入队列
                                        audioBufferQueue.push(audioBytes.buffer);
                                    }
                                    
                                    // 更新处理进度
                                    processedChunks++;
                                    updateProcessingProgress(jsonData);
                                    
                                    // 检查是否是最后一个chunk
                                    if (jsonData.data.status === 2) {
                                        totalChunks = processedChunks;
                                        updateAudioInfo(jsonData);
                                        enableDownload();
                                        statusText.textContent = '合成完成';
                                        statusText.className = 'font-medium text-green-600';
                                    }
                                }
                            } catch (error) {
                                console.error('解析响应数据失败:', error);
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('流式TTS失败:', error);
                statusText.textContent = '合成失败';
                statusText.className = 'font-medium text-red-600';
                apiStatusDisplay.textContent = '请求失败';
                apiStatusDisplay.className = 'font-medium text-red-600';
                updateApiResponse({ error: error.message });
                setPlayingState(false);
            }
        }
        
        // 解码并播放音频
        async function decodeAndPlayAudio(audioData) {
            try {
                // 如果没有AudioContext，创建一个
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    gainNode = audioContext.createGain();
                    gainNode.gain.value = parseFloat(volumeSlider.value);
                    gainNode.connect(audioContext.destination);
                }
                
                // 如果AudioContext被挂起，恢复它
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                
                // 解码音频数据
                const audioBuffer = await audioContext.decodeAudioData(audioData);
                
                // 创建音频源
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(gainNode);
                
                // 记录开始时间
                if (startTime === 0) {
                    startTime = audioContext.currentTime;
                    lastUpdateTime = startTime;
                }
                
                // 更新总时长
                totalDuration += audioBuffer.duration;
                updateTimeDisplay();
                
                // 播放音频
                source.start();
                
                // 创建分析器以获取音频数据用于可视化
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                
                // 获取音频数据并更新可视化
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Float32Array(bufferLength);
                
                // 可视化函数
                function visualize() {
                    animationFrameId = requestAnimationFrame(visualize);
                    analyser.getFloatTimeDomainData(dataArray);
                    updateWaveform(dataArray);
                }
                
                // 开始可视化
                visualize();
                
                // 音频播放结束后清理
                source.onended = () => {
                    cancelAnimationFrame(animationFrameId);
                    
                    // 如果队列中有等待的音频数据，继续播放
                    if (audioBufferQueue.length > 0 && isPlaying && !isPaused) {
                        const nextAudioData = audioBufferQueue.shift();
                        decodeAndPlayAudio(nextAudioData);
                    } else if (!isPaused) {
                        // 如果没有更多数据且没有暂停，更新状态
                        currentTime = totalDuration;
                        updateProgress();
                        updateTimeDisplay();
                        
                        if (processedChunks === totalChunks && totalChunks > 0) {
                            statusText.textContent = '播放完成';
                            statusText.className = 'font-medium text-green-600';
                            setPlayingState(false);
                        }
                    }
                };
                
                // 保存当前音频源以便后续控制
                audioBufferSource = source;
            } catch (error) {
                console.error('解码或播放音频失败:', error);
            }
        }
        
        // 暂停播放
        function pausePlayback() {
            if (isPlaying && !isPaused) {
                if (audioContext && audioContext.state === 'running') {
                    audioContext.suspend();
                }
                
                isPaused = true;
                pauseBtn.innerHTML = '<i class="fa fa-play text-xl"></i>';
                statusText.textContent = '已暂停';
                statusText.className = 'font-medium text-yellow-600';
            } else if (isPlaying && isPaused) {
                // 恢复播放
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                isPaused = false;
                pauseBtn.innerHTML = '<i class="fa fa-pause text-xl"></i>';
                statusText.textContent = '正在播放';
                statusText.className = 'font-medium text-blue-600';
                
                // 如果队列中有等待的音频数据，继续播放
                if (audioBufferQueue.length > 0) {
                    const nextAudioData = audioBufferQueue.shift();
                    decodeAndPlayAudio(nextAudioData);
                }
            }
        }
        
        // 停止播放
        function stopPlayback() {
            // 停止所有音频
            if (audioBufferSource) {
                try {
                    audioBufferSource.stop();
                } catch (e) {
                    // 忽略已停止的音频源错误
                }
            }
            
            // 重置状态
            resetAudioState();
            
            // 更新UI
            setPlayingState(false);
            statusText.textContent = '已停止';
            statusText.className = 'font-medium text-gray-600';
            visualizationPlaceholder.style.display = 'flex';
        }
        
        // 重置音频状态
        function resetAudioState() {
            // 停止所有音频
            if (audioBufferSource) {
                try {
                    audioBufferSource.stop();
                } catch (e) {
                    // 忽略已停止的音频源错误
                }
            }
            
            // 清理AudioContext
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            
            // 重置状态变量
            audioBufferSource = null;
            gainNode = null;
            audioBufferQueue = [];
            isPlaying = false;
            isPaused = false;
            currentTime = 0;
            totalDuration = 0;
            startTime = 0;
            lastUpdateTime = 0;
            streamResponse = null;
            audioBlob = new Blob([], { type: 'audio/mp3' });
            isProcessing = false;
            processedChunks = 0;
            totalChunks = 0;
            audioDataArray = [];
            
            // 重置UI
            updateProgress();
            updateTimeDisplay();
            updateProcessingProgress(null);
            resetWaveform();
            disableDownload();
        }
        
        // 设置播放状态
        function setPlayingState(playing) {
            isPlaying = playing;
            
            // 更新按钮状态
            startBtn.disabled = playing;
            pauseBtn.disabled = !playing;
            stopBtn.disabled = !playing;
            
            // 更新按钮样式
            if (playing) {
                startBtn.classList.add('opacity-50', 'cursor-not-allowed');
                pauseBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                stopBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                statusText.textContent = '正在播放';
                statusText.className = 'font-medium text-blue-600';
            } else {
                startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                pauseBtn.classList.add('opacity-50', 'cursor-not-allowed');
                stopBtn.classList.add('opacity-50', 'cursor-not-allowed');
                pauseBtn.innerHTML = '<i class="fa fa-pause text-xl"></i>';
                isPaused = false;
            }
            
            // 开始或停止进度更新
            if (playing) {
                updateProgress();
            }
        }
        
        // 更新进度
        function updateProgress() {
            if (!isPlaying || isPaused) return;
            
            // 计算当前时间
            if (audioContext && startTime > 0) {
                currentTime = audioContext.currentTime - startTime;
            }
            
            // 计算进度百分比
            const progressPercent = totalDuration > 0 ? (currentTime / totalDuration) * 100 : 0;
            
            // 更新进度条
            progressFill.style.width = `${Math.min(progressPercent, 100)}%`;
            progressHandle.style.left = `${Math.min(progressPercent, 100)}%`;
            
            // 更新时间显示
            updateTimeDisplay();
            
            // 继续更新
            if (isPlaying && !isPaused && currentTime < totalDuration) {
                requestAnimationFrame(updateProgress);
            }
        }
        
        // 更新时间显示
        function updateTimeDisplay() {
            currentTimeDisplay.textContent = formatTime(currentTime);
            totalTimeDisplay.textContent = formatTime(totalDuration);
        }
        
        // 格式化时间
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            seconds = Math.floor(seconds % 60);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // 跳转到指定位置
        function seekAudio(e) {
            if (!audioBufferSource || totalDuration === 0) return;
            
            // 计算点击位置对应的时间
            const rect = progressBar.getBoundingClientRect();
            const percent = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
            const seekTime = totalDuration * percent;
            
            // 停止当前播放
            try {
                audioBufferSource.stop();
            } catch (e) {
                // 忽略已停止的音频源错误
            }
            
            // 重新开始播放
            currentTime = seekTime;
            startTime = audioContext.currentTime - currentTime;
            updateProgress();
            
            // TODO: 实现从指定位置继续播放
            // 这需要重新请求音频数据或缓存已接收的数据
            alert('跳转到指定位置功能需要重新请求音频数据，暂未实现');
        }
        
        // 开始拖动进度条
        function startSeek(e) {
            e.preventDefault();
            
            // 添加鼠标移动和松开事件监听器
            document.addEventListener('mousemove', dragSeek);
            document.addEventListener('mouseup', stopSeek);
        }
        
        // 拖动进度条
        function dragSeek(e) {
            if (!totalDuration) return;
            
            // 计算拖动位置对应的百分比
            const rect = progressBar.getBoundingClientRect();
            const percent = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
            
            // 更新进度条显示
            progressFill.style.width = `${percent * 100}%`;
            progressHandle.style.left = `${percent * 100}%`;
            
            // 更新当前时间显示
            const seekTime = totalDuration * percent;
            currentTimeDisplay.textContent = formatTime(seekTime);
        }
        
        // 停止拖动进度条
        function stopSeek(e) {
            // 移除事件监听器
            document.removeEventListener('mousemove', dragSeek);
            document.removeEventListener('mouseup', stopSeek);
            
            // 跳转到指定位置
            seekAudio(e);
        }
        
        // 更新处理进度
        function updateProcessingProgress(data) {
            if (!data) {
                processingProgressDisplay.textContent = '0%';
                return;
            }
            
            // 计算进度百分比
            const percent = totalChunks > 0 ? Math.round((processedChunks / totalChunks) * 100) : 0;
            processingProgressDisplay.textContent = `${percent}%`;
        }
        
        // 更新音频信息
        function updateAudioInfo(data) {
            if (data.extra_info && data.extra_info.audio_length) {
                const audioLength = data.extra_info.audio_length / 1000; // 转换为秒
                audioLengthDisplay.textContent = `${audioLength.toFixed(1)} 秒`;
                totalDuration = audioLength;
                updateTimeDisplay();
            }
        }
        
        // 更新API响应显示
        function updateApiResponse(data) {
            // 格式化JSON
            const formattedJson = JSON.stringify(data, null, 2);
            
            // 更新显示
            apiResponseDisplay.textContent = formattedJson;
            
            // 滚动到底部
            apiResponseDisplay.scrollTop = apiResponseDisplay.scrollHeight;
        }
        
        // 重置波形图
        function resetWaveform() {
            audioDataArray = [];
            chart.data.labels = [];
            chart.data.datasets[0].data = [];
            chart.update();
        }
        
        // 启用下载按钮
        function enableDownload() {
            downloadBtn.disabled = false;
            downloadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
        
        // 禁用下载按钮
        function disableDownload() {
            downloadBtn.disabled = true;
            downloadBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }
        
        // 下载音频
        function downloadAudio() {
            if (audioBlob.size === 0) {
                alert('没有可下载的音频数据');
                return;
            }
            
            // 创建下载链接
            const url = URL.createObjectURL(audioBlob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `tts-audio-${new Date().getTime()}.mp3`;
            document.body.appendChild(a);
            a.click();
            
            // 清理
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }
    </script>
</body>
