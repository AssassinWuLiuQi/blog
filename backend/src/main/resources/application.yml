spring:
  application:
    name: scholars-manuscript
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/scholars_manuscript?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:scholars_manuscript}
      username: ${MONGO_USERNAME:}
      password: ${MONGO_PASSWORD:}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

encryption:
  public-key: ${RSA_PUBLIC_KEY:}
  private-key: ${RSA_PRIVATE_KEY:}

miniMax:
  api-key: ${MINI_MAX_API_KEY:}

python:
  service:
    url: http://localhost:8000
    timeout: 120
