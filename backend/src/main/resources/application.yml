spring:
  application:
    name: scholars-manuscript
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/scholars_manuscript?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-long-enough-for-hs256}
  expiration: 900000
  refresh-expiration: 604800000

app:
  cors:
    allowed-origins: http://localhost:5173

miniMax:
  api-key: ${MINI_MAX_API_KEY:}